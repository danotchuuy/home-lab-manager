id: minecraft
name: Minecraft (Java)
match: [[minecraft]]
query:
  protocol: minecraft
  port: 25565
  port_env: SERVER_PORT
console:
  rcon_port: 25575
  say: say
  save: save-all
  commands: [list, save-all, "say ", "whitelist add ", "op ", "kick ", time set day, weather clear]
  exec:
    - image: itzg/minecraft-server
      command: "rcon-cli {command}"
      why: This image has rcon-cli, which already knows the server's RCON password.
      off_when: { ENABLE_RCON: "false" }
  players:
    command: list
    format: summary
    # There are 2 of a max of 20 players online: alex, sam
    pattern: '(?s)^\s*There are (?P<online>\d+) of a max of (?P<max>\d+) players online:?(?P<names>.*)$'
  actions:
    kick: "kick {player} {reason}"
    ban: "ban {player} {reason}"
    unban: "pardon {player}"
    allow: "whitelist add {player}"
    disallow: "whitelist remove {player}"
    admin: "op {player}"
    unadmin: "deop {player}"
settings_files:
  - names: [server.properties]
player_lists:
  allow: { file: whitelist.json, format: minecraft-json }
  ban: { file: banned-players.json, format: minecraft-json }
  admin: { file: ops.json, format: minecraft-json }
