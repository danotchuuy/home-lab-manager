id: minecraft-bedrock
name: Minecraft (Bedrock)
match: [[minecraft, bedrock]]
query:
  protocol: bedrock
  port: 19132
  port_env: SERVER_PORT
console:
  say: say
  save: save hold
  commands: [list, "say ", "allowlist add ", "op ", "kick ", time set day]
  exec:
    - image: itzg/minecraft-bedrock-server
      command: "send-command {command}"
      why: This image has send-command, which types commands into the server's console.
  players:
    command: list
    format: summary
    pattern: '(?s)^\s*There are (?P<online>\d+) of a max of (?P<max>\d+) players online:?(?P<names>.*)$'
  # Bedrock has no ban command: its allow list is how players are kept out.
  actions:
    kick: "kick {player} {reason}"
    allow: "allowlist add {player}"
    disallow: "allowlist remove {player}"
    admin: "op {player}"
    unadmin: "deop {player}"
settings_files:
  - names: [server.properties]
player_lists:
  allow: { file: allowlist.json, format: minecraft-json }
