id: valheim
name: Valheim
match: [[valheim]]
query:
  a2s_ports: [2457]
# Valheim has no remote console: its lists are files of platform IDs
# (Steam_7656…), read when it starts; hlm changes them while it's stopped.
player_lists:
  allow: { file: permittedlist.txt, format: lines }
  ban: { file: bannedlist.txt, format: lines }
  admin: { file: adminlist.txt, format: lines }
game_backups:
  # Valheim's own backups (its -backups option), beside the live world.
  - path: worlds_local
    match: "*_backup_*"
    note: Valheim's own backups of the world, beside the live one
  # lloesche/valheim-server's zip backups.
  - path: backups
    match: "*.zip"
    note: The image's zip backups of the world
# Players join over UDP only, so a connection to its TCP ports (its
# console, or a scanner) doesn't wake it while it sleeps.
join_protocols: [udp]
