id: conan
name: Conan Exiles
match: [[conan], [conanexiles]]
query:
  a2s_ports: [27015]
settings_files:
  - names: [ServerSettings.ini]
    prefer: /Saved/Config/
mods:
  start_timeout: 30m
  workshop:
    app_id: 440900
    images:
      # https://github.com/alinmear/docker-conanexiles
      - { image: alinmear/docker-conanexiles, env: CONANEXILES_MODS, separator: "," }
# Players join over UDP only, so a connection to its TCP ports (its
# console, or a scanner) doesn't wake it while it sleeps.
join_protocols: [udp]
