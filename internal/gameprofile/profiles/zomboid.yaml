id: zomboid
name: Project Zomboid
match: [[zomboid]]
query:
  a2s_ports: [16261]
settings_files:
  - names: [servertest.ini]
mods:
  start_timeout: 20m
  workshop:
    app_id: 108600
    images:
      # https://github.com/Renegade-Master/zomboid-dedicated-server: each Workshop item, and the mod name inside it.
      - { image: renegademaster/zomboid-dedicated-server, env: MOD_WORKSHOP_IDS, separator: ";", names_env: MOD_NAMES }
