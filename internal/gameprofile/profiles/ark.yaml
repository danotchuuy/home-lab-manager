id: ark
name: ARK
match: [[ark], [arkse]]
query:
  a2s_ports: [27015]
console:
  rcon_port: 27020
  say: Broadcast
  save: SaveWorld
  commands: [ListPlayers, SaveWorld, "Broadcast ", "ServerChat ", "KickPlayer ", DestroyWildDinos]
  players:
    command: ListPlayers
    # "0. Name, 0002…" per line, or "No Players Connected"
    format: lines
    pattern: '^.*?\. (?P<name>[^,]*)(?:, *(?P<id>\S+))?'
    ignore: [No Players Connected]
  # They take the player's ID from ListPlayers (Steam or EOS).
  actions:
    kick: "KickPlayer {id}"
    ban: "BanPlayer {id}"
    unban: "UnbanPlayer {id}"
    allow: "AllowPlayerToJoinNoCheck {id}"
    disallow: "DisallowPlayerToJoinNoCheck {id}"
settings_files:
  - names: [GameUserSettings.ini, Game.ini]
    prefer: /Saved/Config/
mods:
  # Mods download when the server starts, and can be large.
  start_timeout: 30m
  workshop:
    app_id: 346110
    images:
      # https://github.com/Hermsi1337/docker-ark-server: the first mod wins when two change the same thing.
      - { image: hermsi/ark-server, env: GAME_MOD_IDS, separator: "," }
# Players join over UDP only, so a connection to its TCP ports (its
# console, or a scanner) doesn't wake it while it sleeps.
join_protocols: [udp]
