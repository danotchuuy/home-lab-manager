id: nightingale
name: Nightingale
match: [[nightingale]]
# Nightingale has no Steam query; its dedicated server has an HTTP status
# page instead, at /status on the port -statusPort gives: 503 while
# loading, then 200 with the players' count and names. It's off unless the
# server is started with it (the launch option below), and by default it
# only listens inside the container, hence the listener override.
query:
  protocol: http-status
  port_arg: -statusPort
  max_players: 6
launch_options:
  - id: status
    name: Status endpoint
    description: >-
      Nightingale's HTTP status page (/status), which says whether the server is ready
      for players and who's playing. hlm's status queries use it, so the server shows
      online, its players and idle shutdown work. It's only reachable on your network:
      it's never forwarded or relayed to the internet.
    args: -statusPort={port} -ini:Engine:[HTTPServer.Listeners]:+ListenerOverrides=(Port={port},BindAddress=0.0.0.0)
    port: 7778
# Images that take the game's launch arguments in a variable (most SteamCMD
# images); otherwise they go in the container's command (ghcr.io/ekman/nightingale
# passes it to NWXServer.sh).
args_vars: [GAME_PARAMS, EXTRA_ARGS, SERVER_ARGS, LAUNCH_ARGS, ADDITIONAL_ARGS, SERVER_PARAMS, ARGS]
settings_files:
  - names: [ServerSettings.ini]
    prefer: /NWX/Config/
