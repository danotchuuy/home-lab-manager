# A typical app with a database, a cache and a reverse proxy-ish web part.
name: ignored-here
version: "3.8"
x-common: &common
  restart: unless-stopped
  environment:
    TZ: ${TZ:-Europe/Oslo}

services:
  app:
    <<: *common
    image: nextcloud:29
    ports:
      - "8080:80"
      - "127.0.0.1:9000:9000/tcp"
    volumes:
      - ./html:/var/www/html
      - data:/var/www/html/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the .env}
      - REDIS_HOST=cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks: [default, back]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
  db:
    <<: *common
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nextcloud
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      back:
        aliases: [postgres]
  cache:
    image: redis:7
    command: redis-server --save "" --appendonly no
    networks: [back]
    ulimits:
      nofile: {soft: 1024, hard: 4096}
  cron:
    image: nextcloud:29
    entrypoint: /cron.sh
    network_mode: service:app
    depends_on: [app]
    volumes:
      - ./html:/var/www/html
    stop_grace_period: 1m30s

networks:
  back:
    internal: true

volumes:
  data:
  db:
    name: shared-pg-data
